name: publish npm

# EN: Publishes create-ai-sdlc when a release is published. Prefers npm trusted
#     publishing (OIDC, no token); falls back to NPM_TOKEN if the secret is set.
# VI: Publish create-ai-sdlc khi tao release. Uu tien trusted publishing (OIDC,
#     khong can token); neu co secret NPM_TOKEN thi dung token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest
      - name: sync the package with the repo
        run: bash scripts/sync-npm-package.sh
      - name: smoke test the wrapper
        run: |
          set -euo pipefail
          node packages/create-ai-sdlc/index.js smoke -w node -d /tmp/smoke --no-git
          test -f /tmp/smoke/Makefile
      - name: publish
        working-directory: packages/create-ai-sdlc
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
