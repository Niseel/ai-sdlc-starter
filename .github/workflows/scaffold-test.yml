name: scaffold

# EN: Proves the scaffolder runs on Linux, macOS and Windows and that both
#     scripts write byte-identical files.
# VI: Chung minh script chay duoc tren Linux, macOS, Windows va hai ban tao ra
#     file giong het nhau tung byte.

on:
  push:
    branches: ["**"]
    paths: ["init.sh", "init.ps1", ".github/workflows/scaffold-test.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: bash - scaffold
        shell: bash
        run: |
          set -euo pipefail
          bash init.sh demo -w node,python@3.12,go@1.22,java@21 -d out-sh --no-git
          test -f out-sh/CLAUDE.md
          test -f out-sh/.claude/hooks/guard-bash.sh
          test "$(cat out-sh/.nvmrc)" = "node"
          test "$(cat out-sh/.python-version)" = "3.12"
          echo "files: $(find out-sh -type f | wc -l)"

      - name: bash - long flags produce the same tree
        shell: bash
        run: |
          set -euo pipefail
          bash init.sh --name demo --node latest --python 3.12 --go 1.22 --java 21 -d out-long --no-git
          diff -r out-sh out-long

      - name: bash - re-run is a no-op
        shell: bash
        run: |
          set -euo pipefail
          hash_tree() { find "$1" -type f | LC_ALL=C sort | xargs cat | cksum; }
          before=$(hash_tree out-sh)
          bash init.sh demo -w node,python@3.12,go@1.22,java@21 -d out-sh --no-git
          after=$(hash_tree out-sh)
          test "$before" = "$after"

      - name: pwsh - scaffold
        shell: pwsh
        run: |
          ./init.ps1 demo -With node,python@3.12,go@1.22,java@21 -Dir out-ps -NoGit
          # The quoted form must behave the same way.
          ./init.ps1 demo -With "node,python@3.12,go@1.22,java@21" -Dir out-ps-quoted -NoGit
          # And so must the long flags.
          ./init.ps1 -Name demo -Node latest -Python 3.12 -Go 1.22 -Java 21 -Dir out-ps-long -NoGit
          # The script must leave the shell where it found it.
          if ((Get-Location).Path -ne $PWD.Path) { throw "init.ps1 changed the caller location" }
          if (-not (Test-Path out-ps/CLAUDE.md)) { throw "out-ps/CLAUDE.md missing" }

      - name: compare bash vs pwsh output (byte for byte)
        shell: bash
        run: |
          set -euo pipefail
          diff -r out-sh out-ps
          diff -r out-ps out-ps-quoted
          diff -r out-ps out-ps-long
          echo "bash and pwsh agree on $(find out-sh -type f | wc -l) files"

      - name: manifest for cross-OS comparison
        shell: bash
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          cd out-sh
          find . -type f | LC_ALL=C sort | while read -r f; do
            printf '%s  %s\n' "$(sha "$f" | cut -d' ' -f1)" "$f"
          done > ../manifest.txt
          wc -l ../manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.os }}
          path: manifest.txt

  stack:
    name: generated project passes its own make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: scaffold a project with all four runtimes
        run: bash init.sh demo -w node,python@3.12,go@1.22,java@21 -d demo --no-git
      - name: install and run the project's own gate
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          make check
      - name: a broken change must fail the gate
        working-directory: demo
        run: |
          sed -i 's/Hello, /Hi, /' src/index.js
          if make test; then echo "make test passed on broken code"; exit 1; fi
          echo "make test correctly failed"

  npx:
    name: the npm wrapper runs the same scaffolder
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: sync and pack
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync-npm-package.sh
          cd packages/ai-sdlc-starter
          npm pack
      - name: install the tarball and run it
        shell: bash
        run: |
          set -euo pipefail
          npm install -g ./packages/ai-sdlc-starter/ai-sdlc-starter-*.tgz
          ai-sdlc-starter wrapped -w node,python@3.12 -d out-npx --no-git
          test -f out-npx/Makefile
          test -f out-npx/AGENTS.md
          test "$(cat out-npx/.python-version)" = "3.12"
      - name: the wrapper output matches the script's own
        shell: bash
        run: |
          set -euo pipefail
          bash init.sh wrapped -w node,python@3.12 -d out-direct --no-git
          diff -r out-npx out-direct
          echo "wrapper and init.sh agree"

  adopt:
    name: --adopt keeps an existing project intact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: bash scaffolder
        shell: bash
        run: bash scripts/test-adopt.sh sh "$RUNNER_TEMP/adopt-sh"
      - name: PowerShell scaffolder
        shell: bash
        run: bash scripts/test-adopt.sh ps "$RUNNER_TEMP/adopt-ps"
      - name: both scaffolders adopt the same way
        shell: bash
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/adopt-sh"; b="$RUNNER_TEMP/adopt-ps"
          # Every file byte for byte, except settings.json: jq and PowerShell
          # format JSON differently, so compare that one by content.
          diff -r -x .git -x settings.json "$a" "$b"
          diff <(jq -S . "$a/.claude/settings.json") <(jq -S . "$b/.claude/settings.json")
          echo "bash and PowerShell adopt identically"

  compare:
    name: identical across operating systems
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: manifests }
      - name: diff the manifests
        run: |
          set -euo pipefail
          ls -R manifests
          diff manifests/manifest-ubuntu-latest/manifest.txt manifests/manifest-macos-latest/manifest.txt
          diff manifests/manifest-ubuntu-latest/manifest.txt manifests/manifest-windows-latest/manifest.txt
          echo "All three operating systems produced identical files."
